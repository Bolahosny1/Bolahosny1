<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020514"/>
      <stop offset="100%" stop-color="#070d2e"/>
    </linearGradient>

    <!-- Bar gradients -->
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#00c2cc"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2ea6"/>
      <stop offset="100%" stop-color="#cc0080"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4dffb8"/>
      <stop offset="100%" stop-color="#00cc88"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bar6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bar7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4dffb8"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
    <linearGradient id="bar8" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff2ea6"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="url(#bg)" rx="16"/>

  <!-- Grid lines subtle -->
  <g stroke="#1e2d6e" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="480" x2="900" y2="480"/>
    <line x1="260" y1="0" x2="260" y2="520"/>
    <line x1="860" y1="0" x2="860" y2="520"/>
  </g>

  <!-- Header -->
  <text x="30" y="42" font-family="Consolas, monospace" font-size="15" fill="#4dffb8" filter="url(#textGlow)">$ skills --render --animated --mode=expert</text>
  <line x1="30" y1="56" x2="870" y2="56" stroke="#00f5ff" stroke-width="0.6" opacity="0.4"/>

  <!-- Column headers -->
  <text x="30" y="76" font-family="Consolas, monospace" font-size="10" fill="#4dffb8" opacity="0.6">SKILL</text>
  <text x="270" y="76" font-family="Consolas, monospace" font-size="10" fill="#4dffb8" opacity="0.6">PROFICIENCY</text>
  <text x="852" y="76" font-family="Consolas, monospace" font-size="10" fill="#4dffb8" opacity="0.6" text-anchor="end">LEVEL</text>

  <!-- ======================== ROW 1: Flutter ======================== -->
  <g>
    <text x="30" y="118" font-family="Consolas, monospace" font-size="15" fill="#e8fdff">Flutter</text>
    <text x="30" y="133" font-family="Consolas, monospace" font-size="9" fill="#00f5ff" opacity="0.6">BLoC · Clean Arch · Firebase</text>
    <!-- Track -->
    <rect x="270" y="106" width="560" height="18" rx="9" fill="#0d1535"/>
    <rect x="270" y="106" width="560" height="18" rx="9" fill="none" stroke="#00f5ff" stroke-width="0.5" opacity="0.3"/>
    <!-- Fill animated -->
    <rect x="270" y="106" width="0" height="18" rx="9" fill="url(#bar1)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="532" dur="1.8s" begin="0.1s" fill="freeze"/>
    </rect>
    <!-- Dot marker -->
    <circle cx="802" cy="115" r="6" fill="none" stroke="#00f5ff" stroke-width="1" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.9s" fill="freeze"/>
    </circle>
    <!-- Percentage -->
    <text x="855" y="120" font-family="Consolas, monospace" font-size="14" fill="#00f5ff" text-anchor="end" font-weight="bold" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.9s" fill="freeze"/>
      95%
    </text>
    <!-- Badge -->
    <rect x="858" y="107" width="36" height="16" rx="3" fill="#00f5ff" opacity="0">
      <animate attributeName="opacity" from="0" to="0.15" dur="0.3s" begin="1.9s" fill="freeze"/>
    </rect>
  </g>

  <!-- ======================== ROW 2: Dart ======================== -->
  <g>
    <text x="30" y="170" font-family="Consolas, monospace" font-size="15" fill="#e8fdff">Dart</text>
    <text x="30" y="185" font-family="Consolas, monospace" font-size="9" fill="#00f5ff" opacity="0.6">Null Safety · Async · OOP</text>
    <rect x="270" y="158" width="560" height="18" rx="9" fill="#0d1535"/>
    <rect x="270" y="158" width="0" height="18" rx="9" fill="url(#bar6)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="504" dur="1.8s" begin="0.3s" fill="freeze"/>
    </rect>
    <text x="855" y="172" font-family="Consolas, monospace" font-size="14" fill="#00f5ff" text-anchor="end" font-weight="bold" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.1s" fill="freeze"/>
      90%
    </text>
  </g>

  <!-- ======================== ROW 3: Python ======================== -->
  <g>
    <text x="30" y="222" font-family="Consolas, monospace" font-size="15" fill="#e8fdff">Python</text>
    <text x="30" y="237" font-family="Consolas, monospace" font-size="9" fill="#a855f7" opacity="0.6">ML · Tkinter · Scripting</text>
    <rect x="270" y="210" width="560" height="18" rx="9" fill="#0d1535"/>
    <rect x="270" y="210" width="0" height="18" rx="9" fill="url(#bar2)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="448" dur="1.8s" begin="0.5s" fill="freeze"/>
    </rect>
    <text x="855" y="224" font-family="Consolas, monospace" font-size="14" fill="#a855f7" text-anchor="end" font-weight="bold" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.3s" fill="freeze"/>
      80%
    </text>
  </g>

  <!-- ======================== ROW 4: AWS ======================== -->
  <g>
    <text x="30" y="274" font-family="Consolas, monospace" font-size="15" fill="#e8fdff">AWS Cloud</text>
    <text x="30" y="289" font-family="Consolas, monospace" font-size="9" fill="#f59e0b" opacity="0.6">EC2 · RDS · S3 · Auto Scaling</text>
    <rect x="270" y="262" width="560" height="18" rx="9" fill="#0d1535"/>
    <rect x="270" y="262" width="0" height="18" rx="9" fill="url(#bar5)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="420" dur="1.8s" begin="0.7s" fill="freeze"/>
    </rect>
    <text x="855" y="276" font-family="Consolas, monospace" font-size="14" fill="#f59e0b" text-anchor="end" font-weight="bold" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.5s" fill="freeze"/>
      75%
    </text>
  </g>

  <!-- ======================== ROW 5: Docker ======================== -->
  <g>
    <text x="30" y="326" font-family="Consolas, monospace" font-size="15" fill="#e8fdff">Docker</text>
    <text x="30" y="341" font-family="Consolas, monospace" font-size="9" fill="#ff2ea6" opacity="0.6">Compose · Networks · Volumes</text>
    <rect x="270" y="314" width="560" height="18" rx="9" fill="#0d1535"/>
    <rect x="270" y="314" width="0" height="18" rx="9" fill="url(#bar3)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="392" dur="1.8s" begin="0.9s" fill="freeze"/>
    </rect>
    <text x="855" y="328" font-family="Consolas, monospace" font-size="14" fill="#ff2ea6" text-anchor="end" font-weight="bold" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.7s" fill="freeze"/>
      70%
    </text>
  </g>

  <!-- ======================== ROW 6: Kubernetes ======================== -->
  <g>
    <text x="30" y="378" font-family="Consolas, monospace" font-size="15" fill="#e8fdff">Kubernetes</text>
    <text x="30" y="393" font-family="Consolas, monospace" font-size="9" fill="#4dffb8" opacity="0.6">Deployments · Services · Pods</text>
    <rect x="270" y="366" width="560" height="18" rx="9" fill="#0d1535"/>
    <rect x="270" y="366" width="0" height="18" rx="9" fill="url(#bar4)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="364" dur="1.8s" begin="1.1s" fill="freeze"/>
    </rect>
    <text x="855" y="380" font-family="Consolas, monospace" font-size="14" fill="#4dffb8" text-anchor="end" font-weight="bold" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.9s" fill="freeze"/>
      65%
    </text>
  </g>

  <!-- ======================== ROW 7: Firebase ======================== -->
  <g>
    <text x="30" y="430" font-family="Consolas, monospace" font-size="15" fill="#e8fdff">Firebase</text>
    <text x="30" y="445" font-family="Consolas, monospace" font-size="9" fill="#f59e0b" opacity="0.6">Auth · Firestore · Cloud Func</text>
    <rect x="270" y="418" width="560" height="18" rx="9" fill="#0d1535"/>
    <rect x="270" y="418" width="0" height="18" rx="9" fill="url(#bar8)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="448" dur="1.8s" begin="1.3s" fill="freeze"/>
    </rect>
    <text x="855" y="432" font-family="Consolas, monospace" font-size="14" fill="#ff6b35" text-anchor="end" font-weight="bold" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.1s" fill="freeze"/>
      80%
    </text>
  </g>

  <!-- ======================== ROW 8: Linux ======================== -->
  <g>
    <text x="30" y="482" font-family="Consolas, monospace" font-size="15" fill="#e8fdff">Linux</text>
    <text x="30" y="497" font-family="Consolas, monospace" font-size="9" fill="#4dffb8" opacity="0.6">Bash · Red Hat · Ubuntu · CLI</text>
    <rect x="270" y="470" width="560" height="18" rx="9" fill="#0d1535"/>
    <rect x="270" y="470" width="0" height="18" rx="9" fill="url(#bar7)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="420" dur="1.8s" begin="1.5s" fill="freeze"/>
    </rect>
    <text x="855" y="484" font-family="Consolas, monospace" font-size="14" fill="#4dffb8" text-anchor="end" font-weight="bold" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.3s" fill="freeze"/>
      75%
    </text>
  </g>

  <!-- Corner frames -->
  <path d="M0,20 L0,0 L20,0" fill="none" stroke="#00f5ff" stroke-width="2" opacity="0.6"/>
  <path d="M880,0 L900,0 L900,20" fill="none" stroke="#00f5ff" stroke-width="2" opacity="0.6"/>
  <path d="M0,500 L0,520 L20,520" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.6"/>
  <path d="M880,520 L900,520 L900,500" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.6"/>

  <!-- Border -->
  <rect x="1" y="1" width="898" height="518" fill="none" stroke="#00f5ff" stroke-width="0.8" opacity="0.2" rx="16"/>
</svg>
