    <rect x="111" y="192" width="3" height="14" fill="#00f5ff"/>
    <rect x="116" y="192" width="1" height="14" fill="#00f5ff"/>
    <rect x="119" y="192" width="4" height="14" fill="#00f5ff"/>
    <rect x="125" y="192" width="2" height="14" fill="#00f5ff"/>
