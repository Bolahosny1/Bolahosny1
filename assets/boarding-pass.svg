      <rect x="786" y="73" width="6" height="6"/>
      <rect x="796" y="73" width="6" height="6"/>
      <rect x="776" y="83" width="6" height="6"/>
      <rect x="786" y="83" width="6" height="6"/>
      <rect x="776" y="93" width="6" height="6"/>
      <rect x="796" y="93" width="6" height="6"/>
      <rect x="786" y="103" width="6" height="6"/>
      <rect x="776" y="113" width="6" height="6"/>
      <rect x="796" y="113" width="6" height="6"/>
      <rect x="776" y="121" width="6" height="6"/>
