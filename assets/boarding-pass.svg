<svg width="1100" height="240" viewBox="0 0 1100 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card background gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#12063a"/>
    </linearGradient>

    <!-- Boarding pass gradient (ticket body) -->
    <linearGradient id="ticketBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1545"/>
      <stop offset="65%" stop-color="#0d1545"/>
      <stop offset="65%" stop-color="#090c2e"/>
      <stop offset="100%" stop-color="#090c2e"/>
    </linearGradient>

    <!-- Neon accent gradient -->
    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff2ea6"/>
    </linearGradient>

    <linearGradient id="neonVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glows -->
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- QR cell clip -->
    <clipPath id="qrClip"><rect x="720" y="35" width="130" height="130" rx="4"/></clipPath>
  </defs>

  <!-- Outer container with animated border -->
  <rect x="2" y="2" width="1096" height="236" rx="14" fill="url(#cardBg)" stroke="url(#neonLine)" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Top accent line -->
  <rect x="2" y="2" width="1096" height="4" rx="2" fill="url(#neonLine)" opacity="0.7"/>

  <!-- Airline strip (left decorative) -->
  <rect x="18" y="18" width="4" height="204" rx="2" fill="url(#neonVert)"/>

  <!-- MAIN TICKET BODY background -->
  <rect x="30" y="18" width="1054" height="204" rx="10" fill="url(#ticketBody)"/>

  <!-- Perforated divide line (dashed) -->
  <line x1="710" y1="30" x2="710" y2="210" stroke="#00f5ff" stroke-width="1" stroke-dasharray="4,5" opacity="0.35"/>
  <!-- Notch circles on divider -->
  <circle cx="710" cy="30" r="7" fill="#0a0e27"/>
  <circle cx="710" cy="210" r="7" fill="#0a0e27"/>

  <!-- ====== LEFT SECTION (main ticket) ====== -->

  <!-- AIRLINE LOGO area -->
  <text x="50" y="50" font-family="Consolas, monospace" font-size="11" fill="#00f5ff" opacity="0.7">✦ BOLA-AIR™ · TECH DIVISION</text>

  <!-- Horizontal rule -->
  <line x1="50" y1="58" x2="695" y2="58" stroke="url(#neonLine)" stroke-width="0.7" opacity="0.5"/>

  <!-- FROM -->
  <text x="50" y="82" font-family="Consolas, monospace" font-size="10" fill="#9ad9ff" opacity="0.6" letter-spacing="2">FROM</text>
  <text x="50" y="102" font-family="Consolas, monospace" font-size="32" font-weight="bold" fill="#00f5ff" filter="url(#glow)" letter-spacing="3">JR.DEV</text>
  <text x="50" y="118" font-family="Consolas, monospace" font-size="10" fill="#9ad9ff" opacity="0.5">Junior Developer</text>

  <!-- Arrow -->
  <text x="222" y="104" font-family="Consolas, monospace" font-size="28" fill="url(#neonLine)" filter="url(#softGlow)">──▶</text>

  <!-- TO -->
  <text x="340" y="82" font-family="Consolas, monospace" font-size="10" fill="#9ad9ff" opacity="0.6" letter-spacing="2">TO</text>
  <text x="340" y="102" font-family="Consolas, monospace" font-size="32" font-weight="bold" fill="#a855f7" filter="url(#glow)" letter-spacing="3">YR.TEAM</text>
  <text x="340" y="118" font-family="Consolas, monospace" font-size="10" fill="#9ad9ff" opacity="0.5">Your Engineering Team</text>

  <!-- Separator -->
  <line x1="50" y1="130" x2="695" y2="130" stroke="#1e2d6e" stroke-width="0.7"/>

  <!-- Bottom fields row -->
  <!-- GATE -->
  <text x="50" y="150" font-family="Consolas, monospace" font-size="8" fill="#9ad9ff" opacity="0.6" letter-spacing="1.5">GATE</text>
  <text x="50" y="165" font-family="Consolas, monospace" font-size="18" fill="#4dffb8" font-weight="bold">G7</text>
  <text x="50" y="178" font-family="Consolas, monospace" font-size="8" fill="#9ad9ff" opacity="0.4">Graduate 2026</text>

  <!-- SEAT -->
  <text x="150" y="150" font-family="Consolas, monospace" font-size="8" fill="#9ad9ff" opacity="0.6" letter-spacing="1.5">SEAT</text>
  <text x="150" y="165" font-family="Consolas, monospace" font-size="18" fill="#4dffb8" font-weight="bold">F01</text>
  <text x="150" y="178" font-family="Consolas, monospace" font-size="8" fill="#9ad9ff" opacity="0.4">Full-Stack Capable</text>

  <!-- CLASS -->
  <text x="260" y="150" font-family="Consolas, monospace" font-size="8" fill="#9ad9ff" opacity="0.6" letter-spacing="1.5">CLASS</text>
  <text x="260" y="165" font-family="Consolas, monospace" font-size="18" fill="#ff2ea6" font-weight="bold">PRO+</text>
  <text x="260" y="178" font-family="Consolas, monospace" font-size="8" fill="#9ad9ff" opacity="0.4">Production Ready</text>

  <!-- STATUS -->
  <text x="380" y="150" font-family="Consolas, monospace" font-size="8" fill="#9ad9ff" opacity="0.6" letter-spacing="1.5">STATUS</text>
  <rect x="380" y="154" width="70" height="18" rx="4" fill="#4dffb8" opacity="0.15" stroke="#4dffb8" stroke-width="0.8"/>
  <text x="415" y="167" font-family="Consolas, monospace" font-size="11" fill="#4dffb8" text-anchor="middle" font-weight="bold">BOARDING</text>
  <text x="380" y="180" font-family="Consolas, monospace" font-size="8" fill="#9ad9ff" opacity="0.4">Open to Opportunities</text>

  <!-- FLIGHT NO -->
  <text x="490" y="150" font-family="Consolas, monospace" font-size="8" fill="#9ad9ff" opacity="0.6" letter-spacing="1.5">FLIGHT</text>
  <text x="490" y="165" font-family="Consolas, monospace" font-size="18" fill="#00f5ff" font-weight="bold">BH-2026</text>
  <text x="490" y="178" font-family="Consolas, monospace" font-size="8" fill="#9ad9ff" opacity="0.4">Bola Hosny Refaat</text>

  <!-- Barcode at bottom -->
  <g opacity="0.6">
    <rect x="50" y="192" width="3" height="14" fill="#00f5ff"/>
    <rect x="55" y="192" width="1" height="14" fill="#00f5ff"/>
    <rect x="58" y="192" width="4" height="14" fill="#00f5ff"/>
    <rect x="64" y="192" width="2" height="14" fill="#00f5ff"/>
    <rect x="68" y="192" width="3" height="14" fill="#00f5ff"/>
