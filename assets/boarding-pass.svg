    <rect x="132" y="192" width="3" height="14" fill="#00f5ff"/>
    <rect x="137" y="192" width="4" height="14" fill="#00f5ff"/>
    <rect x="143" y="192" width="1" height="14" fill="#00f5ff"/>
    <rect x="146" y="192" width="2" height="14" fill="#00f5ff"/>
    <rect x="150" y="192" width="3" height="14" fill="#00f5ff"/>
    <rect x="155" y="192" width="1" height="14" fill="#00f5ff"/>
    <rect x="158" y="192" width="4" height="14" fill="#00f5ff"/>
    <rect x="164" y="192" width="2" height="14" fill="#00f5ff"/>
    <rect x="168" y="192" width="3" height="14" fill="#00f5ff"/>
    <text x="112" y="218" font-family="Consolas, monospace" font-size="7" fill="#9ad9ff" opacity="0.5" text-anchor="middle">BOLAHOSNY1-FL-2026-PRO</text>
  </g>

  <!-- ====== RIGHT SECTION (stub) ====== -->

  <!-- QR code (stylized pixelated) -->
  <g clip-path="url(#qrClip)">
    <rect x="720" y="35" width="130" height="130" rx="4" fill="#060b24" stroke="#00f5ff" stroke-width="0.8" stroke-opacity="0.5"/>
    <!-- QR pixels (handcrafted pattern) -->
    <g fill="#00f5ff" opacity="0.85">
      <!-- Top-left finder -->
      <rect x="728" y="43" width="36" height="36" rx="2" fill="none" stroke="#00f5ff" stroke-width="2"/>
      <rect x="734" y="49" width="24" height="24" rx="1" fill="none" stroke="#00f5ff" stroke-width="1.5"/>
      <rect x="740" y="55" width="12" height="12" rx="1"/>
      <!-- Top-right finder -->
      <rect x="806" y="43" width="36" height="36" rx="2" fill="none" stroke="#00f5ff" stroke-width="2"/>
      <rect x="812" y="49" width="24" height="24" rx="1" fill="none" stroke="#00f5ff" stroke-width="1.5"/>
      <rect x="818" y="55" width="12" height="12" rx="1"/>
      <!-- Bottom-left finder -->
      <rect x="728" y="121" width="36" height="36" rx="2" fill="none" stroke="#00f5ff" stroke-width="2"/>
      <rect x="734" y="127" width="24" height="24" rx="1" fill="none" stroke="#00f5ff" stroke-width="1.5"/>
      <rect x="740" y="133" width="12" height="12" rx="1"/>
      <!-- Data pixels (random-ish) -->
      <rect x="776" y="43" width="6" height="6"/>
      <rect x="786" y="43" width="6" height="6"/>
      <rect x="796" y="43" width="6" height="6"/>
      <rect x="776" y="53" width="6" height="6"/>
