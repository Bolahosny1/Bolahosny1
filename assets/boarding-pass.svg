      <rect x="828" y="113" width="6" height="6"/>
      <rect x="818" y="121" width="6" height="6"/>
      <rect x="808" y="131" width="6" height="6"/>
      <rect x="828" y="131" width="6" height="6"/>
      <rect x="818" y="141" width="6" height="6"/>
      <rect x="808" y="151" width="6" height="6"/>
      <rect x="828" y="151" width="6" height="6"/>
    </g>
  </g>
  <text x="785" y="176" font-family="Consolas, monospace" font-size="8" fill="#9ad9ff" text-anchor="middle" opacity="0.5">linkedin.com/in/bola-hosny</text>

  <!-- Right stub details -->
  <text x="875" y="60" font-family="Consolas, monospace" font-size="8" fill="#9ad9ff" opacity="0.6" letter-spacing="1.5" text-anchor="middle">PASSENGER</text>
  <text x="875" y="75" font-family="Consolas, monospace" font-size="13" fill="#e8fdff" text-anchor="middle" font-weight="bold">BOLA HOSNY</text>

  <text x="875" y="100" font-family="Consolas, monospace" font-size="8" fill="#9ad9ff" opacity="0.6" letter-spacing="1.5" text-anchor="middle">EXPERIENCE</text>
  <text x="875" y="115" font-family="Consolas, monospace" font-size="13" fill="#4dffb8" text-anchor="middle" font-weight="bold">3+ YRS</text>

  <text x="875" y="140" font-family="Consolas, monospace" font-size="8" fill="#9ad9ff" opacity="0.6" letter-spacing="1.5" text-anchor="middle">STACK</text>
  <text x="875" y="153" font-family="Consolas, monospace" font-size="10" fill="#00f5ff" text-anchor="middle">Flutter · AWS</text>
  <text x="875" y="167" font-family="Consolas, monospace" font-size="10" fill="#00f5ff" text-anchor="middle">Docker · K8s</text>

  <!-- Pulsing dot on status -->
  <circle cx="875" cy="192" r="5" fill="#4dffb8">
    <animate attributeName="r" values="5;8;5" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="888" y="196" font-family="Consolas, monospace" font-size="9" fill="#4dffb8">HIRING</text>
</svg>
