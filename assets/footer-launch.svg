<svg width="1200" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020514"/>
      <stop offset="60%" stop-color="#08122a"/>
      <stop offset="100%" stop-color="#0d1f3d"/>
    </linearGradient>

    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe8" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffefc0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffefc0" stop-opacity="0"/>
    </radialGradient>

    <!-- Rocket flame -->
    <linearGradient id="flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fff59e"/>
      <stop offset="70%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff2ea6" stop-opacity="0"/>
    </linearGradient>

    <!-- Ground glow -->
    <radialGradient id="groundGlow" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="moonFilter">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rocketGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="svgClip"><rect width="1200" height="180"/></clipPath>
  </defs>

  <g clip-path="url(#svgClip)">
    <!-- Sky background -->
    <rect width="1200" height="180" fill="url(#skyBg)"/>

    <!-- Ground glow at bottom -->
    <ellipse cx="600" cy="185" rx="700" ry="60" fill="url(#groundGlow)"/>

    <!-- Stars (static field) -->
    <g fill="white">
      <circle cx="40" cy="20" r="1" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.3s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="14" r="1.5" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="30" r="1" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.7s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="310" cy="10" r="1.2" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="3.5s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="25" r="1" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.1s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="8" r="1.5" opacity="0.9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="630" cy="18" r="1" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.3s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="750" cy="6" r="1.3" opacity="0.75"><animate attributeName="opacity" values="0.75;0.2;0.75" dur="2.5s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="22" r="1" opacity="0.55"><animate attributeName="opacity" values="0.55;0.1;0.55" dur="3.8s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="11" r="1.4" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="1030" cy="28" r="1" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="14" r="1.6" opacity="0.85"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="1170" cy="35" r="1" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.4s" begin="1.4s" repeatCount="indefinite"/></circle>
      <!-- Extra small ones -->
      <circle cx="70" cy="45" r="0.8" opacity="0.4"><animate attributeName="opacity" values="0.4;0.05;0.4" dur="4s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="390" cy="50" r="0.8" opacity="0.35"><animate attributeName="opacity" values="0.35;0.05;0.35" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="42" r="0.8" opacity="0.4"><animate attributeName="opacity" values="0.4;0.08;0.4" dur="3.7s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="1050" cy="48" r="0.8" opacity="0.35"><animate attributeName="opacity" values="0.35;0.05;0.35" dur="4.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Shooting star -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="8s" repeatCount="indefinite"/>
      <line x1="200" y1="35" x2="350" y2="55" stroke="white" stroke-width="1.5" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="-200,0;400,0" dur="8s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Moon -->
    <g>
      <circle cx="1090" cy="55" r="38" fill="url(#moonGlow)" filter="url(#moonFilter)"/>
      <circle cx="1090" cy="55" r="30" fill="#fffbe8"/>
      <!-- Craters -->
      <circle cx="1078" cy="48" r="5" fill="#f5e8a0" opacity="0.7"/>
      <circle cx="1098" cy="62" r="3.5" fill="#f5e8a0" opacity="0.6"/>
      <circle cx="1085" cy="66" r="2.5" fill="#f5e8a0" opacity="0.5"/>
      <circle cx="1100" cy="44" r="4" fill="#f5e8a0" opacity="0.65"/>
      <circle cx="1072" cy="60" r="3" fill="#f5e8a0" opacity="0.55"/>
    </g>

    <!-- Cloud 1 (scrolling left to right) -->
    <g opacity="0.55">
      <animateTransform attributeName="transform" type="translate" values="-300,0;1500,0" dur="40s" repeatCount="indefinite"/>
      <ellipse cx="100" cy="80" rx="80" ry="22" fill="#0e2040"/>
      <ellipse cx="80" cy="72" rx="50" ry="18" fill="#0e2040"/>
      <ellipse cx="130" cy="70" rx="45" ry="18" fill="#0e2040"/>
    </g>

    <!-- Cloud 2 (slower) -->
    <g opacity="0.4">
      <animateTransform attributeName="transform" type="translate" values="-500,0;1500,0" dur="60s" begin="15s" repeatCount="indefinite"/>
      <ellipse cx="300" cy="90" rx="60" ry="16" fill="#0c1c38"/>
      <ellipse cx="285" cy="82" rx="40" ry="14" fill="#0c1c38"/>
      <ellipse cx="320" cy="80" rx="38" ry="14" fill="#0c1c38"/>
    </g>

    <!-- Horizon city silhouette -->
    <g fill="#0a1830" opacity="0.7">
      <rect x="0" y="135" width="1200" height="45"/>
      <!-- Buildings left -->
      <rect x="20" y="115" width="18" height="20"/>
      <rect x="45" y="105" width="22" height="30"/>
      <rect x="73" y="118" width="14" height="17"/>
      <rect x="92" y="100" width="20" height="35"/>
      <rect x="117" y="112" width="16" height="23"/>
      <rect x="138" y="95" width="24" height="40"/>
      <rect x="167" y="110" width="14" height="25"/>
      <rect x="186" y="120" width="18" height="15"/>
      <rect x="210" y="108" width="20" height="27"/>
      <rect x="235" y="115" width="14" height="20"/>
      <!-- Buildings right -->
      <rect x="900" y="115" width="18" height="20"/>
      <rect x="923" y="105" width="22" height="30"/>
      <rect x="950" y="118" width="16" height="17"/>
      <rect x="971" y="98" width="20" height="37"/>
      <rect x="997" y="112" width="14" height="23"/>
      <rect x="1016" y="94" width="26" height="41"/>
      <rect x="1048" y="110" width="14" height="25"/>
      <rect x="1068" y="120" width="18" height="15"/>
      <rect x="1092" y="108" width="20" height="27"/>
      <rect x="1118" y="115" width="14" height="20"/>
      <rect x="1138" y="105" width="20" height="30"/>
      <rect x="1163" y="118" width="16" height="17"/>
      <!-- Building windows (neon dots) -->
    </g>

    <!-- Window lights on buildings -->
    <g fill="#00f5ff" opacity="0.4">
      <rect x="97" y="103" width="2" height="2"/>
      <rect x="101" y="103" width="2" height="2"/>
      <rect x="97" y="108" width="2" height="2"/>
      <rect x="143" y="98" width="2" height="2"/>
      <rect x="148" y="98" width="2" height="2"/>
      <rect x="143" y="103" width="2" height="2"/>
      <rect x="148" y="108" width="2" height="2"/>
      <rect x="976" y="101" width="2" height="2"/>
      <rect x="981" y="101" width="2" height="2"/>
      <rect x="976" y="107" width="2" height="2"/>
      <rect x="1021" y="97" width="2" height="2"/>
      <rect x="1026" y="97" width="2" height="2"/>
      <rect x="1021" y="103" width="2" height="2"/>
      <rect x="1026" y="108" width="2" height="2"/>
    </g>
    <g fill="#a855f7" opacity="0.35">
      <rect x="51" y="108" width="2" height="2"/>
      <rect x="55" y="108" width="2" height="2"/>
      <rect x="216" y="111" width="2" height="2"/>
      <rect x="220" y="116" width="2" height="2"/>
      <rect x="928" y="108" width="2" height="2"/>
      <rect x="932" y="113" width="2" height="2"/>
      <rect x="1097" y="111" width="2" height="2"/>
      <rect x="1102" y="116" width="2" height="2"/>
    </g>

    <!-- ROCKET (animated launch from center-left) -->
    <g filter="url(#rocketGlow)">
      <animateTransform attributeName="transform" type="translate" values="480,120;520,-80" dur="7s" begin="2s" repeatCount="indefinite"/>
      <!-- Flame -->
      <ellipse cx="0" cy="44" rx="6" ry="22" fill="url(#flame)">
        <animate attributeName="ry" values="22;30;22" dur="0.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.6;1" dur="0.3s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Rocket body -->
      <rect x="-9" y="0" width="18" height="36" rx="4" fill="#d0d8ff"/>
      <!-- Nose cone -->
      <polygon points="-9,0 9,0 0,-20" fill="#a855f7"/>
      <!-- Window -->
      <circle cx="0" cy="12" r="5" fill="#00f5ff" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="0.8s" repeatCount="indefinite"/>
      </circle>
      <!-- Fins -->
      <polygon points="-9,30 -18,44 -9,38" fill="#a855f7"/>
      <polygon points="9,30 18,44 9,38" fill="#a855f7"/>
      <!-- Exhaust particles -->
      <circle cx="-3" cy="50" r="2" fill="#fff59e" opacity="0.7">
        <animate attributeName="cy" values="50;80;50" dur="0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="3" cy="55" r="1.5" fill="#ff6b35" opacity="0.6">
        <animate attributeName="cy" values="55;88;55" dur="0.35s" begin="0.15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="0.35s" begin="0.15s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Second rocket (offset timing) -->
    <g filter="url(#rocketGlow)" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="680,130;710,-70" dur="7s" begin="5.5s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="38" rx="5" ry="18" fill="url(#flame)">
        <animate attributeName="opacity" values="1;0.5;1" dur="0.25s" repeatCount="indefinite"/>
      </ellipse>
      <rect x="-7" y="0" width="14" height="28" rx="3" fill="#c8d2ff"/>
      <polygon points="-7,0 7,0 0,-16" fill="#ff2ea6"/>
      <circle cx="0" cy="10" r="4" fill="#00f5ff" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="0.9s" repeatCount="indefinite"/>
      </circle>
      <polygon points="-7,24 -14,36 -7,30" fill="#ff2ea6"/>
      <polygon points="7,24 14,36 7,30" fill="#ff2ea6"/>
    </g>

    <!-- Footer text overlay -->
    <text x="600" y="155" font-family="Consolas, monospace" font-size="12" fill="#4dffb8" text-anchor="middle" opacity="0.75" filter="url(#softGlow)">
      BolaOS v2026.1 — Cairo → Production — Launch Sequence Complete ✓
    </text>

    <!-- Neon ground line -->
    <line x1="0" y1="135" x2="1200" y2="135" stroke="#00f5ff" stroke-width="0.8" opacity="0.2"/>

    <!-- Top & bottom border glow -->
    <rect x="0" y="0" width="1200" height="3" fill="#00f5ff" opacity="0.4"/>
    <rect x="0" y="177" width="1200" height="3" fill="#a855f7" opacity="0.35"/>
  </g>
</svg>
